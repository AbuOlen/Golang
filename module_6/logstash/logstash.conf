input {
  file {
    path => "/var/log/app/*/app.log"
    start_position => "beginning"
    codec => "json"
    sincedb_path => "/dev/null"
    type => "golang"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "golang-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}